<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>静かな酒と個人な開発</title>

  <style>
    body {
      background-color: #111;
      color: #f5f5f5;
      font-family: serif;
      text-align: center;
      line-height: 2;
      padding: 30px;
      font-size: 18px;
    }

    h1 {
      font-size: 28px;
      margin-top: 40px;
      margin-bottom: 40px;
    }

    h2 {
      font-size: 25px;
      margin-top: 50px;
      margin-bottom: 20px;
    }

    p {
      font-size: 15px;
      margin: 0;
      padding-top: 13px;
      padding-bottom: 10px;
    }

    hr {
      margin-top: 50px;
      margin-bottom: 50px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .icon-links {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 30px;
    }

    .icon-links img {
      width: 60px;
      height: 60px;
      filter: invert(1);
      transition: 0.3s;
    }

    .icon-links img:hover {
      opacity: 0.7;
    }

    .note-icon {
      width: 60px !important;
      height: 60px !important;
    }

    .app-card {
      border: 1px solid #555;
      border-radius: 16px;
      margin: 30px auto;
      max-width: 300px;
      background-color: #181818;
    }

    .app-category {
      font-size: 11px;
      opacity: 0.5;
      margin: 0;
      padding-top: 13px;
      padding-bottom: 10px;
    }

    .app-card a {
      display: block;
    }

    .app-card:hover {
      opacity: 0.8;
      transition: 0.3s;

  background-color: #222;
  border-color: #888;
    }

    .app-card h2 {
  margin-top: 5px;
  margin-bottom: 5px;
}

    .app-icon {
      width: 90px;
      height: 90px;

      margin-top: 20px;
      margin-bottom: 10px;

      border-radius: 22px;

      object-fit: cover;

      box-shadow: 0 0 20px rgba(255, 255, 255, 0.08);
    }
  </style>

</head>

<body>

  <h1>作ったもの</h1>

  <section class="app-card">
    <a href="https://play.google.com/store/apps/details?id=com.hisashi.osakabakun&pcampaignid=web_share"
      target="_blank">
      <img class="app-icon" src="images/sakeno-kioku-kun_icon.png" alt="酒の記憶くん">
      <p class="app-category">Google Play</p>

      <h2>酒の記憶くん</h2>

      <p>好きなお酒を記録するアプリ。</p>
    </a>
  </section>


</body>

</html>
